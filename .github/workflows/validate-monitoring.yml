name: Validate monitoring dashboard

on:
  push:
    branches:
      - main
      - feature/minute-phase-tou-drilldown-20261107
  pull_request:
    branches:
      - main
      - fix/live-dashboard-layout-charts-registers-20261107

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyserial
      - name: Check Python syntax
        run: python -m compileall -q app.py db.py collector.py modbus.py billing.py tariff.py esp32_receiver.py
      - name: Check WBP/LWBP and local SQLite integration
        run: python -m unittest -v test_tariff test_db_tariff
      - name: Smoke test demo interface
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=30).run()
          if at.exception:
              raise AssertionError([str(err.message) for err in at.exception])
          print("Streamlit demo loaded without uncaught exception")
          PY
