name: Validate per-tenant billing and Excel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline-billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py demo_dashboard.py billing.py db.py tariff.py test_billing_tariffs.py
      - name: Test single/double modes, persistence, serial, ESP32 and XLSX
        run: python -m unittest -v test_billing_tariffs
